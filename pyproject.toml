[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[project]
name = "homecortex"
version = "1.2.0"
description = "Local-first voice AI backend for smart homes"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.135.2",
  "uvicorn==0.42.0",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.22",
  "PyYAML==6.0.3",
  "requests==2.33.0",
  "ollama==0.6.1",
  "numpy==2.4.3",
  "librosa==0.11.0",
  "soundfile==0.13.1",
  "piper-tts==1.4.2",
  "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
speaker = [
  "pyannote-audio==4.0.4",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
]
proactive = [
  "APScheduler==3.11.2",
  "pytz==2026.1.post1",
]
observability = [
  "psutil==7.2.2",
  "opentelemetry-api==1.41.1",
  "opentelemetry-sdk==1.41.1",
  "opentelemetry-exporter-otlp==1.41.1",
]

[tool.setuptools]
py-modules = ["server"]

