# ══════════════════════════════════════════════════════════════════════════════
# config/lang/fr.yaml — Mots-clés et textes en français
# Changer LANGUAGE=en dans .env pour utiliser config/lang/en.yaml
# ══════════════════════════════════════════════════════════════════════════════

language: fr
language_name: "Français"

# ── Mots-clés Whisper hint (base) ─────────────────────────────────────────────
whisper_hint_base: "allume, éteins, éteindre, éteint, ouvre, ferme, coupe, active, volet, lumière, salon, escalier, entrée, LoRa, gateway, Zigbee"

# ── Verbes d'action HA ────────────────────────────────────────────────────────
ha_action_verbs:
  - "allume"
  - "éteins"
  - "eteins"
  - "éteint"
  - "eteint"
  - "eteind"
  - "éteinds"
  - "ouvre"
  - "ferme"
  - "règle"
  - "regle"
  - "mets"
  - "coupe"
  - "active"
  - "désactive"
  - "desactive"
  - "monte"
  - "baisse"
  - "pousse"
  - "tire"

# ── Mots-clés heure/date ──────────────────────────────────────────────────────
time_keywords:
  - "quelle heure"
  - "il est quelle heure"
  - "heure est-il"
  - "quelle est l'heure"
  - "quel jour"
  - "quelle date"
  - "on est quel jour"
  - "on est le combien"
  - "quel jour sommes-nous"
  - "quelle heure sommes-nous"

time_hour_keywords:
  - "heure"
  - "heure est-il"

time_date_keywords:
  - "date"
  - "combien"
  - "quel jour"

# ── Mots-clés météo ───────────────────────────────────────────────────────────
weather_keywords:
  - "météo"
  - "temps qu'il fait"
  - "va-t-il pleuvoir"
  - "prévision"
  - "quel temps"
  - "fait-il chaud"
  - "fait-il froid"
  - "température extérieure"
  - "il fait chaud"
  - "il fait froid"

weather_tomorrow: "demain"
weather_day_after: "après-demain"

weather_cities:
  - "genève"
  - "geneva"
  - "paris"
  - "lyon"
  - "lausanne"
  - "zurich"
  - "berne"
  - "london"
  - "berlin"

# ── Questions d'état appareils ────────────────────────────────────────────────
state_question_keywords:
  - "est allumée"
  - "est allumé"
  - "est éteinte"
  - "est éteint"
  - "est ouverte"
  - "est ouvert"
  - "est fermée"
  - "est fermé"
  - "est connectée"
  - "est connecté"
  - "est-elle allumée"
  - "est-il allumé"
  - "quel est l'état"
  - "statut de"
  - "courrier"
  - "colis"
  - "boîte aux lettres"
  - "boite aux lettres"

# ── Questions capteurs ────────────────────────────────────────────────────────
sensor_question_keywords:
  - "température"
  - "temp "
  - "humidité"
  - "co2"
  - "consommation"
  - "parking"
  - "extérieur"
  - "intérieur"

sensor_question_markers:
  - "quelle"
  - "quel"
  - "combien"
  - "?"

# ── Marqueurs de question ─────────────────────────────────────────────────────
question_markers:
  - "?"
  - "est-ce que"
  - "est ce que"
  - "j'ai"
  - "y a-t-il"
  - "y a t il"
  - "avez-vous"
  - "as-tu"
  - "a-t-on"

# ── Patterns questions d'état (regex) ─────────────────────────────────────────
state_regex_patterns:
  - "est[- ]ce que"
  - "est[- ]elle"
  - "est[- ]il"
  - "(?<![a-z])est allum[eé][e]?"
  - "(?<![a-z])est [eé]tein[te]+"
  - "(?<![a-z])est ouvert[e]?"
  - "(?<![a-z])est ferm[eé][e]?"
  - "(?<![a-z])est connect[eé][e]?"

# ── Synonymes de normalisation ────────────────────────────────────────────────
synonyms:
  "lumière":   "lampe"
  "lumieres":  "lampes"
  "lumières":  "lampes"
  "éclairage": "lampe"
  "spot":      "lampe"
  "ampoule":   "lampe"

# ── Articles à supprimer pour le matching ────────────────────────────────────
articles:
  - "le "
  - "la "
  - "les "
  - "l'"
  - "un "
  - "une "
  - "des "
  - "du "
  - "de la "
  - "de l'"

# ── Réponses formatées ────────────────────────────────────────────────────────
responses:
  time_format:    "Il est {hour} heures {minute}."
  date_format:    "Nous sommes le {weekday} {day} {month} {year}."
  datetime_format: "Il est {hour} heures {minute}, le {weekday} {day} {month} {year}."

  weekdays:
    - "lundi"
    - "mardi"
    - "mercredi"
    - "jeudi"
    - "vendredi"
    - "samedi"
    - "dimanche"

  months:
    - "janvier"
    - "février"
    - "mars"
    - "avril"
    - "mai"
    - "juin"
    - "juillet"
    - "août"
    - "septembre"
    - "octobre"
    - "novembre"
    - "décembre"

# ── États HA (get_ha_state.py) ────────────────────────────────────────────────
ha_states:
  # Lampes / switches
  light_on:         "allumée"
  light_off:        "éteinte"
  switch_on:        "allumée"
  switch_off:       "éteinte"

  # Volets / stores
  cover_open:       "ouverte"
  cover_closed:     "fermée"
  cover_partial:    "ouverte à {position}%"

  # Capteurs binaires
  binary_on:        "activé"
  binary_off:       "désactivé"
  motion_on:        "détectée"
  motion_off:       "aucun mouvement"
  door_open:        "ouverte"
  door_closed:      "fermée"
  window_open:      "ouverte"
  window_closed:    "fermée"

  # Connectivité
  connectivity_on:  "en ligne"
  connectivity_off: "hors ligne"

  # Boîte aux lettres
  mail_detected:    "Oui, vous avez du courrier."
  mail_empty:       "Non, aucun courrier détecté."
  parcel_detected:  "Oui, un colis a été déposé."
  parcel_empty:     "Non, aucun colis détecté."

  # Phrases de réponse
  light_reply:      "La {name} est {state}."
  sensor_reply:     "La {type} {location} est de {value} {unit}."
  cover_reply:      "Le {name} est {state}."
  binary_reply:     "{name} est {state}."
  unknown:          "Je n'ai pas pu obtenir l'état de {name}."
  unavailable:      "{name} est indisponible."

# ── Personnalisation avec prénom ──────────────────────────────────────────────
personalization:
  # Réponse courte → prénom à la fin
  short_reply: "{reply}, {name}."
  # Réponse longue → prénom au début
  long_reply: "{name}, {reply_lower}"
  # Seuil longueur courte/longue (caractères)
  short_threshold: 40

# ── detect_expect_reply ───────────────────────────────────────────────────────
no_reply_patterns:
  - "je n'ai pas reçu"
  - "je n'ai pas compris"
  - "je ne sais pas"
  - "veuillez préciser"
  - "quel appareil"
  - "quelle pièce"
  - "plusieurs appareils"

question_regex_patterns:
  - "\\blequel\\b"
  - "\\blaquelle\\b"
  - "\\blesquels\\b"
  - "\\blesquelles\\b"
  - "\\bquel\\b"
  - "\\bquelle\\b"
  - "\\bdans quelle\\b"
  - "\\bdans quel\\b"
  - "\\bvoulez-vous\\b"
  - "\\bsouhaitez-vous\\b"
  - "\\bpréférez-vous\\b"
  - "\\bdésirez-vous\\b"
  - "\\bpuis-je\\b"
  - "\\bpuis je\\b"
  - "\\bpouvez-vous préciser\\b"
  - "\\bpouvez-vous confirmer\\b"

# ── router_llm ────────────────────────────────────────────────────────────────
speaker_context: "\nL'utilisateur s'appelle {name} (confiance: {conf}). Utilise son prénom naturellement dans ta réponse.\n"

person_question_patterns:
  - "qui est"
  - "qu'est"
  - "c'est qui"
  - "connais-tu"
  - "sais-tu"
  - "parle-moi de"
  - "raconte-moi"

# ── Messages système ──────────────────────────────────────────────────────────
tool_unknown:       "J'ai essayé d'utiliser un outil que je ne maîtrise pas encore."
tool_no_result:     "Je n'ai pas pu obtenir l'information."
idle_response:      "Je vous écoute."
tool_reformulation: "Tu es Kira. Réponds UNIQUEMENT en {language_name}, jamais dans une autre langue. Reformule le résultat en une phrase naturelle courte. Pas de listes, pas de markdown, pas de symboles."

# ── Bypass groupe pièces ─────────────────────────────────────────────────────
group_lights_on:  "Les lampes de {room} sont allumées."
group_lights_off: "Les lampes de {room} sont éteintes."
time_hour_singular: "heure"
time_hour_plural:   "heures"
time_quarter_past:  "{h} {hu} et quart."
time_half:          "{h} {hu} et demie."
time_quarter_to:    "{h} {hu} moins le quart."
time_exact:         "Il est {h} {hu} {m}."
time_oclock:        "Il est {h} {hu}."

