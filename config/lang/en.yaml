# ══════════════════════════════════════════════════════════════════════════════
# config/lang/en.yaml — English keywords
# Set LANGUAGE=en in .env to use this file
# ══════════════════════════════════════════════════════════════════════════════

language: en
language_name: "English"

whisper_hint_base: "turn on, turn off, open, close, dim, lights, thermostat, LoRa, gateway, Zigbee"

ha_action_verbs:
  - "turn on"
  - "turn off"
  - "switch on"
  - "switch off"
  - "open"
  - "close"
  - "dim"
  - "brighten"
  - "set"
  - "activate"
  - "deactivate"
  - "raise"
  - "lower"

time_keywords:
  - "what time"
  - "what's the time"
  - "current time"
  - "what day"
  - "what date"
  - "today's date"

time_hour_keywords:
  - "time"
  - "hour"

time_date_keywords:
  - "date"
  - "day"

weather_keywords:
  - "weather"
  - "forecast"
  - "will it rain"
  - "temperature outside"
  - "is it hot"
  - "is it cold"

weather_tomorrow: "tomorrow"
weather_day_after: "day after tomorrow"

weather_cities:
  - "geneva"
  - "paris"
  - "london"
  - "zurich"
  - "lausanne"
  - "berlin"

state_question_keywords:
  - "is it on"
  - "is it off"
  - "is it open"
  - "is it closed"
  - "is it connected"
  - "what's the state"
  - "status of"
  - "mail"
  - "package"
  - "parcel"

sensor_question_keywords:
  - "temperature"
  - "humidity"
  - "co2"
  - "consumption"
  - "outside"
  - "inside"

sensor_question_markers:
  - "what"
  - "how"
  - "?"

question_markers:
  - "?"
  - "is there"
  - "do i have"
  - "have i got"
  - "any"

state_regex_patterns:
  - "is it on"
  - "is it off"
  - "is it open"
  - "is it closed"
  - "(?<![a-z])is (?:the )?\\w+ on"
  - "(?<![a-z])is (?:the )?\\w+ off"

synonyms:
  "light": "lamp"
  "lights": "lamps"
  "bulb": "lamp"

articles:
  - "the "
  - "a "
  - "an "
  - "some "

responses:
  time_format:    "It's {hour}:{minute}."
  date_format:    "Today is {weekday}, {month} {day}, {year}."
  datetime_format: "It's {hour}:{minute} on {weekday}, {month} {day}."

  weekdays:
    - "Monday"
    - "Tuesday"
    - "Wednesday"
    - "Thursday"
    - "Friday"
    - "Saturday"
    - "Sunday"

  months:
    - "January"
    - "February"
    - "March"
    - "April"
    - "May"
    - "June"
    - "July"
    - "August"
    - "September"
    - "October"
    - "November"
    - "December"

ha_states:
  light_on:         "on"
  light_off:        "off"
  switch_on:        "on"
  switch_off:       "off"
  cover_open:       "open"
  cover_closed:     "closed"
  cover_partial:    "open at {position}%"
  binary_on:        "active"
  binary_off:       "inactive"
  motion_on:        "detected"
  motion_off:       "no motion"
  door_open:        "open"
  door_closed:      "closed"
  connectivity_on:  "online"
  connectivity_off: "offline"
  light_reply:      "The {name} is {state}."
  sensor_reply:     "The {type} in {location} is {value} {unit}."
  cover_reply:      "The {name} is {state}."
  binary_reply:     "{name} is {state}."
  unknown:          "Could not get the state of {name}."
  unavailable:      "{name} is unavailable."

mail_detected:    "Yes, you have mail."
mail_empty:       "No mail detected."
parcel_detected:  "Yes, a parcel has been delivered."
parcel_empty:     "No parcel detected."

personalization:
  short_reply: "{reply}, {name}."
  long_reply: "{name}, {reply_lower}"
  short_threshold: 40

# ── detect_expect_reply ───────────────────────────────────────────────────────
no_reply_patterns:
  - "i didn't receive"
  - "i didn't understand"
  - "i don't know"
  - "please specify"
  - "which device"
  - "which room"
  - "multiple devices"

question_regex_patterns:
  - "\\bwhich\\b"
  - "\\bwhat\\b"
  - "\\bwhere\\b"
  - "\\bwould you\\b"
  - "\\bdo you want\\b"
  - "\\bcan you confirm\\b"
  - "\\bcan you specify\\b"
  - "\\bplease clarify\\b"

# ── router_llm ────────────────────────────────────────────────────────────────
speaker_context: "\nThe user's name is {name} (confidence: {conf}). Use their name naturally in your response.\n"

person_question_patterns:
  - "who is"
  - "what is"
  - "tell me about"
  - "do you know"
  - "can you tell me"

# ── System messages ───────────────────────────────────────────────────────────
tool_unknown:       "I tried to use a tool I don't master yet."
tool_no_result:     "I could not retrieve the information."
idle_response:      "I'm listening."
tool_reformulation: "You are Kira. Respond ONLY in {language_name}. Reformulate the result in one short natural sentence. No lists, no markdown, no symbols."

# ── Room group bypass ─────────────────────────────────────────────────────────
group_lights_on:  "The lights in {room} are on."
group_lights_off: "The lights in {room} are off."
time_hour_singular: "o'clock"
time_hour_plural:   ""
time_quarter_past:  "quarter past {h}."
time_half:          "half past {h}."
time_quarter_to:    "quarter to {h}."
time_exact:         "It is {h}:{m}."
time_oclock:        "It is {h}."

# ── memory.py ─────────────────────────────────────────────────────────────────

intent_patterns:
  weather:   ["weather", "temperature", "rain", "wind", "sun", "forecast"]
  light:     ["lamp", "light", "turn on", "turn off", "lighting"]
  shutter:   ["shutter", "blind", "open", "close"]
  heating:   ["heating", "thermostat", "temperature", "hot", "cold"]
  question:  ["who", "what", "how", "why", "when", "where"]
  identity:  ["kira", "you are", "your name", "who are you", "created"]

intent_stop_words:
  - "what"
  - "which"
  - "with"
  - "into"
  - "from"
  - "very"
  - "well"
  - "make"

fact_triggers:
