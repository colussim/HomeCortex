# ══════════════════════════════════════════════════════════════════════════════
# config/phonetic.yaml — Phonetic corrections for Whisper
#
# Whisper sometimes transcribes phonetically similar words incorrectly.
# This file maps incorrect transcriptions to the correct ones.
#
# Format: "incorrect_transcription": "correction"
# Keys are in lowercase — comparison is case-insensitive.
# ══════════════════════════════════════════════════════════════════════════════

corrections:
  # -------------------------  Network / Home Automation ------------------------- 
  "loire":   "lora"        # "Gateway Loire" → "Gateway LoRa"
  "laura":   "lora"        # "Gateway Laura" → "Gateway LoRa"
  "loran":   "lora"        # phonetic variant
  "zigby":   "zigbee"      # "zigby" → "zigbee"
  "zigbi":   "zigbee"
  "zwave":   "z-wave"
  "ilo":    "ilot"  
  "ILO":    "ilot"   
  "HILO":    "ilot"       

  # -------------------------  Voice Commands ------------------------- 
  "et un":   "éteins"      
  "et ain":  "éteins"      
  "étain":   "éteins"      
  "eteins":  "éteins"      
  "salaud":  "salon"       
  "salot":   "salon"
  "allume":  "allume"      
  "alume":   "allume"     

  # -------------------------  Proper nouns -------------------------
  "gaulet":  "golay"      
  "goalay":  "golay"
  "colluci": "colussi"
  "colusi":  "colussi"

  # -------------------------  Rooms -------------------------
  # Add here the errors that Whisper makes on your room names
  # "entré":  "entrée"      # example

# -------------------------  Words to force in Whisper vocabulary -------------------------
# These words are added to WHISPER_HINT to force their recognition
force_vocabulary:
  - "éteins"
  - "éteindre"
  - "allume"
  - "Golay"
  - "Colussi"
  - "LoRa"
  - "Zigbee"
  - "salon"
  - "escalier"
  - "entrée"
  - "ilot"
